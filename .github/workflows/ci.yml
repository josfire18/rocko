name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "addons.txt"]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Install deps and compile-check
    # A squash-merged PR ("... (#12)") was already tested on the PR itself: don't run it
    # a second time for the push to main.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '(#')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio
      - name: Byte-compile all Python files
        run: python -m compileall -q .
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest -q; fi
